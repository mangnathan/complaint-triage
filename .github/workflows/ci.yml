# Relance les contrôles de qualité sur une machine propre à chaque PR et à chaque push sur main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Lecture seule : la CI n'a aucune raison de pouvoir modifier le dépôt.
permissions:
  contents: read

# Un nouveau push sur la même branche annule l'exécution précédente, devenue inutile.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types et tests
    # Version fixe : ubuntu-latest change de système sans prévenir.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Actions épinglées sur un SHA de commit : une étiquette de version peut être déplacée.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true

      - name: Installer les dépendances du uv.lock
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format (ruff)
        run: uv run ruff format --check .

      - name: Types (mypy)
        run: uv run mypy

      - name: Tests (pytest)
        run: uv run pytest --ignore=tests/safety

      # Étape à part, pour qu'une régression de sûreté soit visible au premier coup d'œil :
      # un modèle hostile ne doit jamais faire exécuter une action interdite.
      - name: Scénarios de sûreté de l'agent
        run: uv run pytest tests/safety -v

  integration:
    name: Base PostgreSQL et tests d'intégration
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Base jetable, détruite à la fin de la tâche : son mot de passe n'est pas un secret.
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci-base-jetable
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_ADMIN_PASSWORD: ci-base-jetable
      # Sans base, les tests d'intégration sont sautés ; ici, un test sauté doit échouer.
      REQUIRE_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          python-version: "3.12"
          enable-cache: true

      - name: Installer les dépendances du uv.lock
        run: uv sync --locked

      - name: Mettre en place la base avec le script du projet
        run: uv run python scripts/db/setup_database.py

      - name: Tests d'intégration (droits de la base, outils de l'agent)
        run: uv run pytest tests/integration -v

  docker:
    name: Image Docker
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construire l'image
        run: docker build --tag complaint-triage:ci .

      - name: L'application démarre dans l'image
        run: |
          docker run --rm complaint-triage:ci
          docker run --rm complaint-triage:ci python -c "import complaint_triage.agent.graph, complaint_triage.rag.answer"

      - name: L'image tourne sans root et ne contient ni secret ni donnée
        run: |
          test "$(docker run --rm complaint-triage:ci id -u)" != "0"
          docker run --rm complaint-triage:ci sh -c 'test ! -e /app/.env && test ! -e /app/data && test ! -e /app/tests'

  demo:
    name: Image de démonstration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Construire l'image de démonstration
        run: docker build --file demo/Dockerfile --tag complaint-triage-demo:ci .

      - name: Lancer la démo comme l'hébergeur
        run: docker run --detach --name demo --publish 7860:7860 complaint-triage-demo:ci

      - name: L'interface répond et la base est prête
        run: |
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:7860/_stcore/health | grep -q ok; then
              break
            fi
            sleep 2
          done
          docker logs demo 2>&1 | grep "Base de démonstration prête"
          curl --silent --fail http://localhost:7860/_stcore/health | grep -q ok

      - name: La démo tourne sans root
        run: test "$(docker exec demo id -u)" != "0"

      - name: Journaux de la démo en cas d'échec
        if: failure()
        run: docker logs demo || true
