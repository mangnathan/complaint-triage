[project]
name = "complaint-triage"
version = "0.0.0"
description = "Priorisation des réclamations clients en banque de détail, sur les données publiques du CFPB."
readme = "README.md"
authors = [{ name = "Nathan Mang" }]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "matplotlib>=3.9",
    "pyarrow>=26.0.0",
    "pandera>=0.34.1",
]

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.18",
    "pandas-stubs>=2.2",
    "pytest>=8.4",
    "pre-commit>=4.3",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W",  # style PEP 8
    "F",       # erreurs logiques (variables inutilisées, imports manquants)
    "I",       # ordre des imports
    "UP",      # syntaxe Python moderne
    "B",       # pièges courants (arguments mutables par défaut, etc.)
    "SIM",     # simplifications
    "N",       # conventions de nommage
    "S",       # sécurité (bandit) : SQL concaténé, secrets en dur, subprocess...
]

[tool.ruff.lint.per-file-ignores]
# Les scripts appellent des URL et un navigateur fixes, choisis par nous : pas d'entrée utilisateur.
"scripts/**" = ["S310", "S603"]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "scripts"]


[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
